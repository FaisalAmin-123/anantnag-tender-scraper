services:
  - type: web
    name: anantnag-tender-scraper
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 4 -b 0.0.0.0:10000 api:app"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DOWNLOAD_DIR
        value: "/tmp/pdfs"
      - key: PORT
        value: "10000"